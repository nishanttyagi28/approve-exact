[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "approve-exact"
version = "0.1.0"
description = "Human approval of exact payment effects before provider calls"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NISHANT TYAGI" }]
dependencies = [
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["approve_exact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call Razorpay Test Mode (manual only)",
]
